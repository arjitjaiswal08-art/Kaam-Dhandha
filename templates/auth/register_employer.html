{% extends "base.html" %}

{% block title %}Employer Registration - Kaam Dhandha{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-briefcase"></i> Employer Registration</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Name/Business Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="business_type" class="form-label">Business Type *</label>
                            <select class="form-select" id="business_type" name="business_type" required>
                                <option value="">Select Type</option>
                                <option value="Farmer">Farmer</option>
                                <option value="Contractor">Contractor</option>
                                <option value="Shop Owner">Shop Owner</option>
                                <option value="Small Business">Small Business</option>
                                <option value="Panchayat Office">Panchayat Office</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="contact" class="form-label">Contact Number *</label>
                            <input type="tel" class="form-control" id="contact" name="contact" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="village" class="form-label">Village *</label>
                            <input type="text" class="form-control" id="village" name="village" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" name="address" rows="2"></textarea>
                    </div>
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> Your account will be pending approval by the admin before you can post jobs.
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <hr>
                <p class="text-center mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
